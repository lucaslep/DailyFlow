<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2E64BC" />
    <meta name="description" content="Organize suas tarefas e acompanhe seu progresso." />
    <title>Focus Workspace</title>
  </head>
  <body>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("focus-theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = savedTheme ?? (systemDark ? "dark" : "light");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
