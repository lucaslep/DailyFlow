services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: productivity_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masterkey}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productivity_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-masterkey}@database:5432/productivity_manager?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-production-2026}
      CORS_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@taskpulse.local}
      NODE_ENV: development
      PORT: 3333
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3333
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
